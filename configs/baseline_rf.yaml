# Baseline 2: MFCC statistics + Random Forest
base: base.yaml
name: baseline_rf

features:
  n_mfcc: 40
  n_mels: 128
  win_ms: 46.0
  hop_ms: 23.0

model:
  name: rf
  params: {n_estimators: 500, max_depth: null, max_features: sqrt, min_samples_leaf: 1,
           class_weight: null, n_jobs: -1}
  search:
    n_estimators: [300, 500, 1000]
    max_features: [sqrt, log2]
    min_samples_leaf: [1, 2]

train:
  batch_size: 64
  select_metric: macro_f1
