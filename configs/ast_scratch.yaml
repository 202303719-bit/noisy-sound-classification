# Same AST architecture, random initialisation -> pretrained-vs-scratch comparison.
base: ast.yaml
name: ast_scratch

model:
  params:
    pretrained: false
    hidden_dropout: 0.1
    attention_dropout: 0.1

train:
  lr: 0.0001                # higher LR + longer warm-up when training from scratch
  weight_decay: 0.05
  epochs: 60
  warmup_epochs: 5
  early_stopping_patience: 15
