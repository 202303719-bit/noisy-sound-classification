# Classic model 2: CRNN (CNN + BiGRU + attention pooling) trained from scratch on log-mel
base: base.yaml
name: crnn_scratch

model:
  name: crnn
  params:
    channels: [64, 128, 256]
    rnn_hidden: 128
    rnn_layers: 1
    attn_hidden: 128
    dropout: 0.3
    block_dropout: 0.1
    spec_augment: {enabled: true, freq_mask: 24, time_mask: 40, n_freq_masks: 2, n_time_masks: 2}

train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  batch_size: 32
  epochs: 100
  warmup_epochs: 5
  scheduler: cosine
  min_lr_ratio: 0.01
  label_smoothing: 0.1
  mixup_alpha: 0.0
  grad_clip: 5.0
  amp: true
  early_stopping_patience: 20
  select_metric: macro_f1
